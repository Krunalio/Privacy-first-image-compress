  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Privacy guarantee enforced by the browser: the page may not open any
       network connection (connect-src 'none'), so images cannot be uploaded. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="theme-color" content="#000000" />
  <meta name="keywords" content="privacy image compress,compress image online,free image compressor,local compression">
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!-- HTML Meta Tags -->
  <title>Privacy First Compress - Local Image Compressor</title>
  <meta name="description"
    content="Privacy First Compress - Compress images locally in your browser. No server upload, no tracking. Keep your images private.">

  <!-- Facebook Meta Tags -->
  <meta property="og:url" content="https://privacy-first-image-compress.vercel.app">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Privacy First Compress - Local Image Compressor">
  <meta property="og:description"
    content="Compress images locally in your browser without uploading. Complete privacy, no tracking. Fast and free.">

</head>

<body>
  <noscript>
    <h1>Privacy First Compress</h1>
    <p>A free, open-source image compressor that runs entirely in your browser. Your photos are never uploaded:
      compression happens on your own device. Output keeps the same resolution with near-identical quality, and JPEG
      photos keep their date taken, camera and location details.</p>
    <p>You can compress many images at once and download them as a ZIP. If compression would not make a file smaller,
      you get the original back.</p>
    <p><strong>You need to enable JavaScript to use the app.</strong></p>
    <p><a href="https://github.com/Krunalio/Privacy-first-image-compress">Source code on GitHub (MIT license)</a></p>
  </noscript>
